<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBC Digital Stock Audit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SBC Digital Stocktake</h1>
            <p>Insan Gedung Ilmu Trading</p>
        </header>

        <section class="audit-form-card">
            <h2>Record Stock</h2>
            <form id="auditForm">
                <div class="form-group">
                    <label for="rackId">Rack ID:</label>
                    <input type="text" id="rackId" placeholder="e.g., 23 or 3A" required>
                </div>
                
                <div class="form-group">
                    <label for="itemCode">Item Code / ISBN:</label>
                    <!-- type="text" ensures custom hyphenated codes like 11-30 are accepted safely -->
                    <input type="text" id="itemCode" placeholder="e.g., 11-30 or 955..." required>
                </div>

                <div class="form-group">
                    <label for="expectedQty">System Expected Qty:</label>
                    <input type="number" id="expectedQty" placeholder="0" required>
                </div>

                <div class="form-group">
                    <label for="physicalQty">Physical Count Qty:</label>
                    <input type="number" id="physicalQty" placeholder="0" required>
                </div>

                <button type="submit" class="btn-primary">Save Audit Record</button>
            </form>
        </section>

        <section class="controls">
            <button id="exportCsvBtn" class="btn-export">Download All Racks (CSV)</button>
            <button id="clearDataBtn" class="btn-danger">Clear Device Data</button>
        </section>

        <section class="data-view">
            <h2>Saved Records (Local Device)</h2>
            <div class="table-responsive">
                <table id="auditTable">
                    <thead>
                        <tr>
                            <th>Rack</th>
                            <th>Item Code</th>
                            <th>Expected</th>
                            <th>Counted</th>
                            <th>Variance</th>
                        </tr>
                    </thead>
                    <tbody id="auditTableBody">
                        <!-- Data will be injected here via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
